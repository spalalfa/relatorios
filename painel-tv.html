<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Painel de Coletas">
<title>Painel de Coletas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    :root{
        --bg:#080a0d;
        --panel:#101318;
        --panel2:#151920;
        --border:rgba(255,255,255,.08);
        --text:#f4f6f8;
        --muted:#8f98a3;
        --accent:#e31b23;
        --green:#20c77a;
        --yellow:#f2b84b;
        --red:#ef5350;
        --shadow:0 18px 50px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}

    html,body{
        margin:0;
        width:100%;
        height:100%;
        background:var(--bg);
        color:var(--text);
        font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        overflow:hidden;
    }

    body{
        min-height:100vh;
    }

    .app{
        height:100vh;
        display:flex;
        flex-direction:column;
        padding:22px 28px 18px;
        gap:16px;
    }

    .topbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        min-height:76px;
        border-bottom:1px solid var(--border);
        padding-bottom:16px;
    }

    .brand{
        display:flex;
        align-items:center;
        gap:15px;
        min-width:0;
    }

    .logo{
        width:52px;
        height:52px;
        border-radius:15px;
        display:grid;
        place-items:center;
        background:var(--accent);
        color:white;
        font-size:25px;
        font-weight:900;
        box-shadow:0 10px 28px rgba(227,27,35,.25);
    }

    .brand h1{
        margin:0;
        font-size:clamp(24px,2.2vw,38px);
        line-height:1;
        letter-spacing:-.04em;
    }

    .brand p{
        margin:7px 0 0;
        color:var(--muted);
        font-size:clamp(12px,1vw,15px);
    }

    .top-info{
        display:flex;
        align-items:center;
        gap:14px;
    }

    .date-box,.clock-box{
        background:var(--panel);
        border:1px solid var(--border);
        border-radius:14px;
        padding:10px 16px;
        text-align:right;
    }

    .date-box span,.clock-box span{
        display:block;
        color:var(--muted);
        font-size:11px;
        text-transform:uppercase;
        letter-spacing:.1em;
    }

    .date-box strong{
        display:block;
        margin-top:3px;
        font-size:18px;
    }

    .clock-box strong{
        display:block;
        margin-top:1px;
        font-size:22px;
        font-variant-numeric:tabular-nums;
    }

    .controls{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
    }

    .summary{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
    }

    .stat{
        min-width:105px;
        background:var(--panel);
        border:1px solid var(--border);
        border-radius:12px;
        padding:9px 13px;
    }

    .stat small{
        color:var(--muted);
        display:block;
        font-size:10px;
        text-transform:uppercase;
        letter-spacing:.08em;
    }

    .stat strong{
        display:block;
        margin-top:2px;
        font-size:22px;
    }

    .actions{
        display:flex;
        gap:8px;
    }

    button{
        border:1px solid var(--border);
        background:var(--panel);
        color:var(--text);
        border-radius:10px;
        padding:10px 14px;
        cursor:pointer;
        font-weight:700;
    }

    button:hover{
        background:var(--panel2);
    }

    .board{
        flex:1;
        min-height:0;
        overflow:auto;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
        gap:14px;
        align-content:start;
        padding-right:4px;
    }

    .region-card{
        background:linear-gradient(145deg,var(--panel),#0d1014);
        border:1px solid var(--border);
        border-radius:17px;
        overflow:hidden;
        box-shadow:var(--shadow);
        min-height:250px;
    }

    .region-head{
        padding:16px 18px 14px;
        border-bottom:1px solid var(--border);
        background:rgba(255,255,255,.015);
    }

    .region-line{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        gap:12px;
    }

    .region-name{
        display:flex;
        align-items:center;
        gap:10px;
        min-width:0;
    }

    .pin{
        width:34px;
        height:34px;
        border-radius:10px;
        background:rgba(227,27,35,.14);
        color:#ff6268;
        display:grid;
        place-items:center;
        font-size:17px;
        flex:none;
    }

    .region-name h2{
        margin:0;
        font-size:clamp(19px,1.5vw,27px);
        letter-spacing:-.025em;
    }

    .region-name p{
        margin:3px 0 0;
        color:var(--muted);
        font-size:12px;
    }

    .crew{
        text-align:right;
        flex:none;
    }

    .crew small{
        color:var(--muted);
        display:block;
        font-size:9px;
        text-transform:uppercase;
        letter-spacing:.1em;
    }

    .crew strong{
        display:block;
        margin-top:3px;
        font-size:13px;
    }

    .crew .helper{
        color:var(--muted);
        font-weight:500;
        font-size:11px;
        margin-top:2px;
    }

    .progress-wrap{
        margin-top:13px;
    }

    .progress-meta{
        display:flex;
        justify-content:space-between;
        color:var(--muted);
        font-size:11px;
        margin-bottom:6px;
    }

    .progress{
        height:7px;
        border-radius:999px;
        background:#242a31;
        overflow:hidden;
    }

    .progress > div{
        height:100%;
        border-radius:inherit;
        background:var(--green);
        transition:width .35s ease;
    }

    .collections{
        padding:7px 12px 12px;
    }

    .collection{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:10px 7px;
        border-bottom:1px solid rgba(255,255,255,.05);
    }

    .collection:last-child{
        border-bottom:0;
    }

    .collection-name{
        font-weight:700;
        font-size:14px;
        line-height:1.25;
    }

    .collection-time{
        color:var(--muted);
        font-size:10px;
        margin-top:4px;
    }

    .status{
        flex:none;
        min-width:83px;
        text-align:center;
        padding:6px 8px;
        border-radius:999px;
        font-size:9px;
        font-weight:900;
        letter-spacing:.05em;
    }

    .status-feita{
        color:#5ff0ac;
        background:rgba(32,199,122,.12);
        border:1px solid rgba(32,199,122,.18);
    }

    .status-pendente{
        color:#ffd477;
        background:rgba(242,184,75,.12);
        border:1px solid rgba(242,184,75,.18);
    }

    .status-nao{
        color:#ff7774;
        background:rgba(239,83,80,.12);
        border:1px solid rgba(239,83,80,.18);
    }

    .empty{
        padding:25px 16px;
        text-align:center;
        color:var(--muted);
        font-size:12px;
    }

    .footer{
        min-height:25px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        color:var(--muted);
        font-size:10px;
        border-top:1px solid var(--border);
        padding-top:8px;
    }

    .live{
        display:flex;
        align-items:center;
        gap:6px;
    }

    .live-dot{
        width:7px;
        height:7px;
        border-radius:50%;
        background:var(--green);
        box-shadow:0 0 10px rgba(32,199,122,.8);
    }

    .loading{
        grid-column:1/-1;
        min-height:240px;
        display:grid;
        place-items:center;
        color:var(--muted);
        background:var(--panel);
        border:1px solid var(--border);
        border-radius:17px;
    }

    .error{
        color:#ff8582;
    }

    @media(max-width:800px){
        html,body{overflow:auto}
        .app{height:auto;min-height:100vh;padding:14px}
        .topbar{align-items:flex-start}
        .top-info{display:none}
        .controls{align-items:flex-start;flex-direction:column}
        .board{grid-template-columns:1fr;overflow:visible}
    }

    /* Modo TV: reduz interface quando a tela é pequena em altura */
    @media(min-width:1000px) and (max-height:700px){
        .app{padding:14px 20px 10px;gap:9px}
        .topbar{min-height:57px;padding-bottom:10px}
        .logo{width:42px;height:42px;border-radius:12px}
        .stat{padding:6px 10px}
        .stat strong{font-size:18px}
        .region-head{padding:11px 14px}
        .collection{padding:7px}
        .region-card{min-height:210px}
    }
</style>
</head>

<body>
<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">S</div>
            <div>
                <h1>SPAL • COLETAS</h1>
                <p>Painel operacional em tempo real</p>
            </div>
        </div>

        <div class="top-info">
            <div class="date-box">
                <span>Operação</span>
                <strong id="dateLabel">--/--/----</strong>
            </div>

            <div class="clock-box">
                <span>Horário</span>
                <strong id="clock">--:--:--</strong>
            </div>
        </div>
    </header>

    <section class="controls">
        <div class="summary">
            <div class="stat">
                <small>Total</small>
                <strong id="statTotal">0</strong>
            </div>

            <div class="stat">
                <small>Pendentes</small>
                <strong id="statPending">0</strong>
            </div>

            <div class="stat">
                <small>Feitas</small>
                <strong id="statDone">0</strong>
            </div>

            <div class="stat">
                <small>Não feitas</small>
                <strong id="statNotDone">0</strong>
            </div>
        </div>

        <div class="actions">
            <button id="refreshBtn">↻ Atualizar</button>
            <button id="fullscreenBtn">⛶ Tela cheia</button>
        </div>
    </section>

    <main id="board" class="board">
        <div class="loading">Carregando operação...</div>
    </main>

    <footer class="footer">
        <div class="live">
            <span class="live-dot"></span>
            <span>Conectado ao sistema</span>
        </div>
        <span id="lastUpdate">Última atualização: --:--:--</span>
    </footer>

</div>

<script>
/* ============================================================
   MESMA CONFIGURAÇÃO DO painel-coletas.html
============================================================ */

const SUPABASE_URL =
    "https://ewawkukleqboozavhovb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_WQ_vLGpDP9aveeUOtDNNJw_8Kg7L73y";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* ============================================================
   ESTADO
============================================================ */

let regions = [];
let drivers = [];
let collections = [];
let schedules = [];

/* ============================================================
   UTILITÁRIOS
============================================================ */

function today() {
    const d = new Date();
    const offset = d.getTimezoneOffset();
    const local = new Date(
        d.getTime() - offset * 60000
    );
    return local.toISOString().slice(0, 10);
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(date) {
    if (!date) return "-";
    const parts = date.split("-");
    if (parts.length !== 3) return date;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function formatTime(value) {
    if (!value) return "-";

    const d = new Date(value);

    return d.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}

function statusLabel(status) {
    if (status === "feita") return "FEITA";
    if (status === "nao_feita") return "NÃO FEITA";
    return "PENDENTE";
}

function statusClass(status) {
    if (status === "feita") return "status-feita";
    if (status === "nao_feita") return "status-nao";
    return "status-pendente";
}

function regionName(id) {
    const region = regions.find(
        r => r.id === id
    );

    return region
        ? region.nome
        : "Sem região";
}

function driverName(id) {
    const driver = drivers.find(
        d => d.id === id
    );

    return driver
        ? driver.nome
        : "Não definido";
}

/* ============================================================
   CARREGAMENTO — MESMAS TABELAS DO SISTEMA ATUAL
============================================================ */

async function loadRegions() {
    const { data, error } = await db
        .from("spal_regioes")
        .select("*")
        .eq("ativo", true)
        .order("nome");

    if (error) {
        throw error;
    }

    regions = data || [];
}

async function loadDrivers() {
    const { data, error } = await db
        .from("spal_motoristas")
        .select("*")
        .eq("ativo", true)
        .order("nome");

    if (error) {
        throw error;
    }

    drivers = data || [];
}

async function loadCollections(date) {
    const { data, error } = await db
        .from("spal_coletas")
        .select("*")
        .eq("data_coleta", date)
        .order("horario_registro");

    if (error) {
        throw error;
    }

    collections = data || [];
}

async function loadSchedules(date) {
    const { data, error } = await db
        .from("spal_motoristas_dia")
        .select("*")
        .eq("data", date)
        .order("created_at");

    if (error) {
        throw error;
    }

    schedules = data || [];
}

/* ============================================================
   RENDERIZAÇÃO
============================================================ */

function renderBoard(date) {

    const board =
        document.getElementById("board");

    const total =
        collections.length;

    const pending =
        collections.filter(
            x => x.status === "pendente"
        ).length;

    const done =
        collections.filter(
            x => x.status === "feita"
        ).length;

    const notDone =
        collections.filter(
            x => x.status === "nao_feita"
        ).length;

    document.getElementById(
        "statTotal"
    ).textContent = total;

    document.getElementById(
        "statPending"
    ).textContent = pending;

    document.getElementById(
        "statDone"
    ).textContent = done;

    document.getElementById(
        "statNotDone"
    ).textContent = notDone;

    document.getElementById(
        "dateLabel"
    ).textContent = formatDate(date);

    if (!regions.length) {
        board.innerHTML =
            '<div class="loading">Nenhuma região ativa cadastrada.</div>';
        return;
    }

    let html = "";

    regions.forEach(region => {

        const regionCollections =
            collections.filter(
                item =>
                    item.regiao_id === region.id
            );

        const schedule =
            schedules.find(
                item =>
                    item.regiao_id === region.id
            );

        const motorista =
            schedule
                ? driverName(schedule.motorista_id)
                : "Não definido";

        const ajudante =
            schedule && schedule.ajudante_id
                ? driverName(schedule.ajudante_id)
                : "Sem ajudante";

        const regionTotal =
            regionCollections.length;

        const regionDone =
            regionCollections.filter(
                x => x.status === "feita"
            ).length;

        const progress =
            regionTotal
                ? Math.round(
                    (regionDone / regionTotal) * 100
                )
                : 0;

        html += `
            <article class="region-card">

                <div class="region-head">

                    <div class="region-line">

                        <div class="region-name">
                            <div class="pin">📍</div>

                            <div>
                                <h2>
                                    ${escapeHtml(region.nome)}
                                </h2>

                                <p>
                                    ${regionTotal}
                                    ${regionTotal === 1
                                        ? "coleta"
                                        : "coletas"}
                                </p>
                            </div>
                        </div>

                        <div class="crew">
                            <small>Equipe</small>

                            <strong>
                                🚚 ${escapeHtml(motorista)}
                            </strong>

                            <div class="helper">
                                👤 ${escapeHtml(ajudante)}
                            </div>
                        </div>

                    </div>

                    <div class="progress-wrap">

                        <div class="progress-meta">
                            <span>
                                ${regionDone}/${regionTotal}
                                concluídas
                            </span>

                            <strong>
                                ${progress}%
                            </strong>
                        </div>

                        <div class="progress">
                            <div style="width:${progress}%"></div>
                        </div>

                    </div>

                </div>

                <div class="collections">
        `;

        if (!regionCollections.length) {

            html += `
                <div class="empty">
                    Nenhuma coleta registrada para hoje.
                </div>
            `;

        } else {

            regionCollections.forEach(item => {

                html += `
                    <div class="collection">

                        <div>
                            <div class="collection-name">
                                ${escapeHtml(item.nome)}
                            </div>

                            <div class="collection-time">
                                🕐 Registrada às
                                ${formatTime(item.horario_registro)}
                            </div>
                        </div>

                        <span class="status ${statusClass(item.status)}">
                            ${statusLabel(item.status)}
                        </span>

                    </div>
                `;

            });
        }

        html += `
                </div>
            </article>
        `;
    });

    board.innerHTML = html;
}

/* ============================================================
   ATUALIZAÇÃO
============================================================ */

async function loadAll() {

    const date = today();

    try {

        await Promise.all([
            loadRegions(),
            loadDrivers()
        ]);

        await Promise.all([
            loadCollections(date),
            loadSchedules(date)
        ]);

        renderBoard(date);

        document.getElementById(
            "lastUpdate"
        ).textContent =
            "Última atualização: " +
            new Date().toLocaleTimeString(
                "pt-BR"
            );

    } catch (error) {

        console.error(
            "Erro ao carregar painel:",
            error
        );

        document.getElementById(
            "board"
        ).innerHTML = `
            <div class="loading error">
                Não foi possível carregar o painel.
                Verifique a conexão com o Supabase.
            </div>
        `;
    }
}

/* ============================================================
   RELÓGIO
============================================================ */

function updateClock() {

    document.getElementById(
        "clock"
    ).textContent =
        new Date().toLocaleTimeString(
            "pt-BR"
        );
}

setInterval(
    updateClock,
    1000
);

updateClock();

/* ============================================================
   BOTÕES
============================================================ */

document.getElementById(
    "refreshBtn"
).addEventListener(
    "click",
    loadAll
);

document.getElementById(
    "fullscreenBtn"
).addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Tela cheia:",
                error
            );
        }
    }
);

/* ============================================================
   SUPABASE REALTIME
   Usa as mesmas tabelas do painel-coletas.html
============================================================ */

db.channel("spal-painel-tv-live")

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "spal_coletas"
        },
        () => {
            loadAll();
        }
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "spal_motoristas_dia"
        },
        () => {
            loadAll();
        }
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "spal_motoristas"
        },
        () => {
            loadAll();
        }
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "spal_regioes"
        },
        () => {
            loadAll();
        }
    )

    .subscribe();

/* ============================================================
   FALLBACK DE SEGURANÇA
   Mesmo sem Realtime habilitado, o painel verifica alterações.
============================================================ */

setInterval(
    loadAll,
    30000
);

/* ============================================================
   INICIALIZAÇÃO
============================================================ */

loadAll();

</script>
</body>
</html>
